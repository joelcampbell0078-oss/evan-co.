<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-label="Evan &amp; Co. Furniture" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Evan &amp; Co. Furniture</title>
  <style>
    .draw { fill: none; stroke: #5a3e2b; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.1s ease forwards; }
    .accent { stroke: #b08a4e; }
    .a1 { animation-delay: 0s; }
    .a2 { animation-delay: .2s; }
    .a3 { animation-delay: .4s; }
    .a4 { animation-delay: .55s; }
    .a5 { animation-delay: .7s; }
    .a6 { animation-delay: .9s; }
    .word { opacity: 0; transform: translateX(-14px); animation: slide .9s ease 1.5s forwards; }
    .tag  { opacity: 0; transform: translateX(-14px); animation: slide .9s ease 1.9s forwards; }
    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes slide { to { opacity: 1; transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .draw, .word, .tag { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; transform: none !important; }
    }
  </style>

  <!-- Armchair icon -->
  <g transform="translate(10 14)">
    <path class="draw a1" pathLength="100" d="M32 62 V34 Q32 22 44 22 H76 Q88 22 88 34 V62"/>
    <path class="draw a2" pathLength="100" d="M22 62 H98 V80 H22 Z"/>
    <path class="draw a3" pathLength="100" d="M10 56 Q10 48 16 48 Q22 48 22 56 V82 H10 Z"/>
    <path class="draw a3" pathLength="100" d="M98 56 Q98 48 104 48 Q110 48 110 56 V82 H98 Z"/>
    <path class="draw a4" pathLength="100" d="M16 82 L19 102"/>
    <path class="draw a4" pathLength="100" d="M104 82 L101 102"/>
    <path class="draw accent a5" pathLength="100" d="M38 71 H82"/>
    <path class="draw accent a6" pathLength="100" d="M2 106 H118"/>
  </g>

  <!-- Wordmark -->
  <text class="word" x="150" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#5a3e2b">Evan <tspan fill="#b08a4e">&amp;</tspan> Co.</text>
  <text class="tag" x="153" y="112" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="9" fill="#b08a4e">FURNITURE</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
